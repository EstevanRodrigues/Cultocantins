<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato | Cultocantins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="menu" class="menu"></header>
<main>
<section class="fale">
 <div>
  <h1><span>Fale</span> Conosco</h1>
  <p>Quer compartilhar uma história, sugestão ou informação?</p>
  <p>Sua participação também faz parte da nossa cultura.</p>
 </div>
 <div class="redes">
  <a href="https://instagram.com/cultocantins/" style="text-decoration:none"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>@cultucantins</a>
  <a href="mailto:cultocantins@gmail.com" style="text-decoration:none"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M2 6l10 8 10-8"/></svg>cultocantins@gmail.com</a>
 </div>
 <div class="pessoa"><img src="img/contato.png" alt="Homem indígena com cocar e megafone"></div>
</section>
<form id="form-contato" class="form" novalidate>
 <h2>Entre em contato</h2>
 <label for="nome">Nome*</label><input id="nome" name="nome" required>
 <label for="email">E-mail*</label><input id="email" name="email" type="email" required>
 <label for="assunto">Assunto*</label><input id="assunto" name="assunto" required>
 <label for="mensagem">Mensagem*</label><textarea id="mensagem" name="mensagem" required></textarea>
 <button type="submit">Enviar mensagem</button>
 <p id="msg" class="msg" role="status"></p>
</form>
</main>
<footer id="rodape"></footer>
<script src="script.js"></script>
</body>
</html>
